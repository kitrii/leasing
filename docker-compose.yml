#      - db
#      - minio
#    ports:
#      - "8000:8000"
#    environment:
#      DATABASE_URL: postgresql+psycopg2://leasing_user:leasing_pass@db:5432/leasing
#      MINIO_ENDPOINT: minio:9000
#      MINIO_ACCESS_KEY: minioadmin
#      MINIO_SECRET_KEY: minioadmin

volumes:
  postgres_data:
  minio_data:
