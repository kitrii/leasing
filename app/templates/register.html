<!-- app/templates/register.html -->
{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-500 to-teal-400 py-10">

    <div class="w-full max-w-lg bg-white shadow-xl rounded-2xl p-10 animate-fadeIn">

        <h2 class="text-4xl font-bold text-center text-teal-600 mb-6">
            Создать аккаунт
        </h2>

        {% if message %}
        <p class="text-red-600 text-center mb-4 font-semibold">
            {{ message }}
        </p>
        {% endif %}

        <form action="/register" method="post" class="space-y-5">

            <!-- Email -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Email</label>
                <input
                    type="email"
                    name="email"
                    required
                    class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-400 focus:border-teal-400 transition"
                >
            </div>

            <!-- ФИО -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">ФИО</label>
                <input
                    type="text"
                    name="full_name"
                    class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-400 focus:border-teal-400 transition"
                >
            </div>

            <!-- Телефон -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Телефон</label>
                <input
                    type="text"
                    name="phone"
                    class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-400 focus:border-teal-400 transition"
                >
            </div>

            <!-- Пароль -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Пароль</label>
                <input
                    type="password"
                    name="password"
                    required
                    class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-400 focus:border-teal-400 transition"
                >
            </div>

            <!-- Роль -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Роль</label>
                <select
                    name="role"
                    class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-teal-400 focus:border-teal-400 transition"
                >
                    <option value="user">Пользователь</option>
                    <option value="manager">Менеджер</option>
                </select>
            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="w-full bg-teal-600 text-white p-3 rounded-lg font-semibold text-lg hover:bg-teal-700 transition shadow-md"
            >
                Зарегистрироваться
            </button>

        </form>

        <p class="text-center text-gray-600 mt-6">
            Уже есть аккаунт?
            <a href="/login" class="text-teal-600 font-bold hover:underline">Войти</a>
        </p>

    </div>

</div>

<style>
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.animate-fadeIn { animation: fadeIn 0.5s ease-out; }
</style>

{% endblock %}
