{% extends "base.html" %}
{% block title %}Создать заявку{% endblock %}

{% block content %}

<div class="lease-card">

    <a href="/dashboard" class="back-btn">← Назад в личный кабинет</a>

    <h2 class="title">Создать заявку на лизинг</h2>

    <form id="leaseForm" class="lease-form">

        <div class="form-group">
            <label>Оборудование</label>
            <input type="text" name="equipment" placeholder="Например: погрузчик Hyundai" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Аванс (₽)</label>
                <input type="number" name="advance" placeholder="100000" required>
            </div>

            <div class="form-group">
                <label>Срок (мес.)</label>
                <input type="number" name="term" placeholder="36" required>
            </div>

            <div class="form-group">
                <label>Ставка (%)</label>
                <input type="number" step="0.01" name="rate" placeholder="12.5" required>
            </div>
        </div>

        <div class="form-group">
            <label>Схема платежей</label>
            <select name="payment_scheme">
                <option value="annuity">Аннуитет</option>
                <option value="differentiated">Дифференцированная</option>
            </select>
        </div>

        <div class="form-group">
            <label>Документы</label>
            <input type="file" name="documents" multiple>
            <small class="hint">Паспорт, ИНН, выписка из банка (PDF/JPEG/PNG)</small>
        </div>

        <button type="submit" class="submit-btn">Отправить заявку</button>
    </form>

    <p id="resultMessage" class="result-message"></p>
</div>

<!-- ---------- JAVASCRIPT ---------- -->
<script>
document.getElementById("leaseForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const formData = new FormData(this);

    let response = await fetch("/api/leases/create", {
        method: "POST",
        body: formData
    });

    let data = await response.json();

    const msg = document.getElementById("resultMessage");
    msg.innerText = data.message;
    msg.classList.remove("error", "success");
    msg.classList.add(data.success ? "success" : "error");

    if (data.success) {
        this.reset();
    }
});
</script>

<!-- ---------- STYLES ---------- -->
<style>
.lease-card {
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    max-width: 650px;
    margin: auto;
    position: relative;
}

.back-btn {
    display: inline-block;
    margin-bottom: 15px;
    color: #007777;
    font-weight: bold;
    font-size: 15px;
    text-decoration: none;
    transition: 0.2s;
}

.back-btn:hover {
    color: #009999;
}

.title {
    text-align: center;
    margin-bottom: 25px;
    color: #004d4d;
}

.lease-form .form-group {
    margin-bottom: 18px;
}

.form-row {
    display: flex;
    gap: 15px;
}

.form-group label {
    color: #006666;
    font-weight: bold;
    margin-bottom: 4px;
    display: block;
}

input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #b3d9ff;
    border-radius: 6px;
    font-size: 14px;
    background: #f7fbff;
    transition: 0.2s;
}

input:focus,
select:focus {
    border-color: #3399ff;
    background: #ffffff;
    outline: none;
    box-shadow: 0 0 5px rgba(51, 153, 255, 0.4);
}

.submit-btn {
    width: 100%;
    padding: 12px;
    background: #009999;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 10px;
}

.submit-btn:hover {
    background: #007777;
}

.hint {
    font-size: 12px;
    color: #888;
}

/* Result message */
.result-message {
    margin-top: 15px;
    font-weight: bold;
    text-align: center;
    font-size: 16px;
}

.result-message.success {
    color: #009944;
}

.result-message.error {
    color: #cc0000;
}

/* Adaptive */
@media (max-width: 600px) {
    .form-row {
        flex-direction: column;
    }
}
</style>

{% endblock %}
