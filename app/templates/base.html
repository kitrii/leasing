<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Современный мягкий шрифт MANROPE -->
    <link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <title>{% block title %}Лизингомания{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Gentium Book Plus', sans-serif;
            background: #f6f7fb;
        }

        html {
            scroll-behavior: smooth;
        }

        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
    </style>
</head>

<body class="text-gray-800">

<header class="bg-gradient-to-r from-teal-500 to-blue-600 text-white p-5 shadow-xl">
    <div class="max-w-7xl mx-auto flex justify-between items-center">

        <a href="/" class="text-2xl font-bold tracking-tight hover:opacity-90 transition">
            Лизингомания
        </a>

        <nav class="flex gap-4 text-lg font-medium">
            {% if user %}
                <a href="/dashboard"
                   class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 transition backdrop-blur-md">
                    Личный кабинет
                </a>
                <a href="/logout"
                   class="px-4 py-2 rounded-xl bg-red-500 hover:bg-red-600 transition">
                    Выйти
                </a>
            {% else %}
                <a href="/login"
                   class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 transition backdrop-blur-md">
                    Вход
                </a>
                <a href="/register"
                   class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 transition backdrop-blur-md">
                    Регистрация
                </a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="p-8">
    <div class="max-w-5xl mx-auto">
        {% block content %}{% endblock %}
    </div>
</main>

</body>
</html>
