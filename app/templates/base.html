<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Лизингомания{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

<header class="bg-teal-600 text-white p-4 shadow flex justify-between items-center">
    <a href="/" class="text-xl font-bold">Лизингомания</a>
    <nav>
        {% if user %}
            <a href="/dashboard" class="px-3 py-1 hover:bg-teal-700 rounded">Личный кабинет</a>
            <a href="/logout" class="px-3 py-1 bg-red-500 hover:bg-red-600 rounded">Выйти</a>
        {% else %}
            <a href="/login" class="px-3 py-1 hover:bg-teal-700 rounded">Вход</a>
            <a href="/register" class="px-3 py-1 hover:bg-teal-700 rounded">Регистрация</a>
        {% endif %}
    </nav>
</header>

<main class="p-6">
    <div class="max-w-7xl mx-auto">
        {% block content %}{% endblock %}
    </div>
</main>

</body>
</html>
